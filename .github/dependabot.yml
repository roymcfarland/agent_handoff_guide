version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # tsconfig.json uses baseUrl, which TypeScript 6 rejects with TS5101.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # HANDOFF.md tracks Express 5 as a migration for the app.get("*") route.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      # Keep declarations on the Express 4 runtime major during that migration.
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
