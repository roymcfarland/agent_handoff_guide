version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # HANDOFF.md tracks Express 5 as a migration for the app.get("*") route.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      # Keep declarations on the Express 4 runtime major during that migration.
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node 24 runtime; Node 26 types would describe APIs the runtime lacks. Minor/patch still flow through the group.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) is not adopted: it needs its own evaluation (the baseUrl removal and any tooling peer ranges). Minor/patch still flow through the group.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Ignore lucide-react 0.x minors as well as majors. The 0.489.0 release added
      # aria-hidden by default for decorative React icons. The upgrade review found
      # redrawn icons and no security benefit. The merged 0.577.0 update (#76) grew
      # the gzip JS bundle by 0.15%. Patches (currently 0.577.x) still flow through
      # npm-minor-patch. Refresh the icon set deliberately in its own slice.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
