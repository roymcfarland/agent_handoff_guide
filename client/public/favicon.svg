  <circle class="tip" cx="12" cy="3.2" r="1.9" />
  <rect class="inkfill" x="1.2" y="11" width="2.3" height="5" rx="0.8" />
  <rect class="inkfill" x="20.5" y="11" width="2.3" height="5" rx="0.8" />
  <rect class="ink" x="4.2" y="7.2" width="15.6" height="13.6" rx="3" fill="none" stroke-width="2.2" />
  <circle class="inkfill" cx="9" cy="12.6" r="1.8" />
  <circle class="inkfill" cx="15" cy="12.6" r="1.8" />
  <path class="ink" d="M9 17h6" fill="none" stroke-width="1.8" stroke-linecap="round" />
</svg>
